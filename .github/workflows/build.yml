name: Build Daijin

on:
  push:
    branches: [ gomod, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ gomod, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # For git describe

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.3'

    - name: Build for Android ARM64
      env:
        GOOS: android
        GOARCH: arm64
        CGO_ENABLED: 0
      run: |
        VERSION=$(git describe --tags --always --dirty)
        go build -ldflags="-s -w -X main.version=$VERSION" \
          -o daijin-android-arm64 \
          ./cmd/daijin

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: daijin-android-arm64
        path: daijin-android-arm64

    - name: Upload to release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: daijin-android-arm64
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.3'

    - name: Run tests
      run: go test -v ./...

    - name: Run go vet
      run: go vet ./...
